name: skill-scout

# Daily self-improving skill discovery agent.
# Runs Claude Code on a cron, searches GitHub for newly-released Claude Code
# skills and agent definitions, evaluates them against the vault's current
# skill registry, and opens a PR proposing additions/upgrades.
#
# REQUIRED SECRET: ANTHROPIC_API_KEY
#   Add at: Settings → Secrets and variables → Actions → New repository secret
# REQUIRED PERMISSIONS: contents: write, pull-requests: write (set below).

on:
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC daily — off the top-of-hour stampede
  workflow_dispatch:      # allow manual runs
    inputs:
      lookback_days:
        description: "How many days back to scan for new skills"
        required: false
        default: "1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: skill-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "claude-skill-scout[bot]"
          git config user.email "skill-scout@users.noreply.github.com"

      - name: Run skill scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
          REPORT_DATE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="skill-scout/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # Hand the prompt to headless Claude Code.
          # --print streams the final response and exits.
          # --permission-mode acceptEdits lets the agent write files without prompting.
          claude \
            --print \
            --permission-mode acceptEdits \
            --model claude-opus-4-7 \
            "$(cat .github/scripts/skill-scout-prompt.md)" \
            > /tmp/scout-output.log 2>&1 || {
              echo "::error::Claude Code run failed"
              tail -50 /tmp/scout-output.log
              exit 1
            }

          echo "--- scout output (last 50 lines) ---"
          tail -50 /tmp/scout-output.log

          # If the agent staged or wrote anything, commit + push + open PR.
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "skill-scout: daily discovery run $(date -u +%Y-%m-%d)

Auto-generated by .github/workflows/skill-scout.yml.
See thinking/skill-scout-*.md for the day's findings."
            git push -u origin "$BRANCH"

            # Open PR via gh (preinstalled on ubuntu-latest)
            EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
            if [ -z "$EXISTING" ]; then
              gh pr create \
                --base main \
                --head "$BRANCH" \
                --draft \
                --title "skill-scout: daily findings $(date -u +%Y-%m-%d)" \
                --body "Auto-generated by the daily skill-scout workflow.

See \`thinking/skill-scout-$(date -u +%Y-%m-%d).md\` for the full report.

Review the proposed skill additions/upgrades and merge selectively, or close this PR if nothing is worth adopting today."
            else
              echo "PR #$EXISTING already exists for branch $BRANCH — pushed additional commits."
            fi
          else
            echo "No changes proposed today. Exiting cleanly."
          fi
