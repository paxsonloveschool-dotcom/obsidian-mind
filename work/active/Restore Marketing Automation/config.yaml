# ============================================================================
# AGENT AUTONOMY LEVELS
# ============================================================================
# Controls how much each agent can do without asking. Levels:
#   - review-required: agent drafts, owner reviews + approves before sending
#   - review-optional: agent sends, summary posted to owner for passive review
#   - fully-autonomous: agent sends, no owner touch unless escalation triggered
#
# RECOMMENDATION: start every agent at review-required for the first month.
# Promote to review-optional after 5 successful runs. Promote to fully-
# autonomous after 20 successful runs + zero escalations.
# ============================================================================

agent_autonomy:
  intake_qualification: "review-optional"   # Low risk, high volume
  proposal: "review-required"               # High risk, client-facing, revenue-impacting
  onboarding: "review-optional"             # Standard content, medium risk
  project_coordinator: "fully-autonomous"   # Internal only, low risk
  deliverable_qc: "review-required"         # Quality gate, owner should see fails
  invoicing: "review-required"              # Start here, promote after v0.1 validation
  reporting: "fully-autonomous"             # Data aggregation, low risk
  retention: "review-required"              # Relationship-sensitive, high risk

# ============================================================================
