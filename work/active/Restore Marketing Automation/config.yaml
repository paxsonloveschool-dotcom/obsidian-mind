# ============================================================================
# SERVICES — what Restore Marketing Co actually sells
# ============================================================================
# Every proposal the automation generates is built from one or more of these.
# List the services you ACTUALLY deliver. If you have more, add them.
# ============================================================================

services:
  # -----------------------------------------------------------------------
  # WEBSITES — project work, fixed fee
  # -----------------------------------------------------------------------
  - id: "website-build"
    name: "Website Design & Build"
    short_description: "Brand-aligned, conversion-focused website designed, built, and launched — mobile-first, accessible, fast, and search-engine ready from day one."
    deliverables:
      - "Discovery and brand audit"
      - "Sitemap and page-by-page content plan"
      - "Visual design (desktop + mobile)"
      - "Built site on chosen CMS (WordPress / Webflow / Shopify — TODO: confirm default)"
      - "Core Web Vitals optimization (LCP, CLS, INP targets met)"
      - "On-page SEO baseline (meta, schema, internal linking)"
      - "Google Analytics 4 + conversion tracking setup"
      - "Launch checklist + 14-day post-launch support"
    pricing:
      model: "fixed"
      amount: 0                 # TODO: base website project price — see Q4 ask
      currency: "USD"
    typical_timeline_days: 45
    ideal_for: "Local service businesses launching new, relaunching, or rebuilding their site to drive more leads"

  # -----------------------------------------------------------------------
  # FULL-SERVICE RETAINER — the primary monthly offer
  # -----------------------------------------------------------------------
  - id: "full-service-retainer"
    name: "Full-Service Marketing Retainer"
    short_description: "Monthly retainer combining paid ads management, SEO, Google Business Profile, content, and reporting. One partner, one bill, one accountable team."
    deliverables:
      - "Paid ads management (Google Ads, Meta Ads — platforms per engagement)"
      - "SEO build-out and ongoing optimization (technical, on-page, content)"
      - "Google Business Profile management (posts, photos, reviews, Q&A, local pack work)"
      - "Content production aligned to keyword strategy"
      - "Weekly progress update + monthly performance report"
      - "Quarterly strategy review + roadmap adjustment"
    pricing:
      model: "retainer"
      amount: 0                 # TODO: monthly retainer floor — see Q4 ask
      currency: "USD"
      billing_frequency: "monthly"
    typical_timeline_days: 30
    ideal_for: "Local service businesses doing $500k–$10M annual revenue, ready to commit to 3+ months of compounding marketing investment"

  # -----------------------------------------------------------------------
  # PAID ADS MANAGEMENT — standalone retainer
  # -----------------------------------------------------------------------
  - id: "ads-management"
    name: "Paid Ads Management"
    short_description: "Google Ads and Meta Ads managed monthly — creative, targeting, bid strategy, conversion tracking, and optimization."
    deliverables:
      - "Account audit + restructure (month 1)"
      - "Campaign creation / migration"
      - "Ad creative (copy + images) — 3-5 variants per campaign"
      - "Weekly bid + budget + targeting optimization"
      - "Conversion tracking setup + reporting"
      - "Monthly performance report with recommendations"
    pricing:
      model: "retainer"
      amount: 0                 # TODO: monthly ads management fee — see Q4 ask
      currency: "USD"
      billing_frequency: "monthly"
      notes: "Ad spend billed separately / passed through to client — management fee is for the management work only"
    typical_timeline_days: 30
    ideal_for: "Businesses with $2k+/month ad budget looking for hands-off management"

  # -----------------------------------------------------------------------
  # SEO SERVICES — standalone retainer
  # -----------------------------------------------------------------------
  - id: "seo-services"
    name: "SEO Build-out & Optimization"
    short_description: "Monthly SEO work: technical, on-page, content, local, and authority building. Track rankings, traffic, and leads."
    deliverables:
      - "Technical SEO audit + fixes (ongoing)"
      - "On-page optimization (titles, meta, schema, internal links)"
      - "Keyword strategy + content briefs"
      - "Content production (1-4 pieces/month depending on tier)"
      - "Local SEO (NAP consistency, citations, local schema)"
      - "Rankings + traffic + lead monitoring"
      - "Monthly performance report"
    pricing:
      model: "retainer"
      amount: 0                 # TODO: monthly SEO retainer — see Q4 ask
      currency: "USD"
      billing_frequency: "monthly"
    typical_timeline_days: 30
    ideal_for: "Businesses that want to compound organic traffic over 6-12+ months"

  # -----------------------------------------------------------------------
  # GOOGLE BUSINESS PROFILE MANAGEMENT — standalone or bolt-on
  # -----------------------------------------------------------------------
  - id: "gbp-management"
    name: "Google Business Profile Management"
    short_description: "GBP optimization, weekly posts, photo updates, review response, Q&A, and local pack ranking work."
    deliverables:
      - "GBP audit + optimization"
      - "Weekly posts (4-5/month)"
      - "Photo additions monthly"
      - "Review response within 24 hours"
      - "Q&A management"
      - "Local pack ranking tracking + monthly report"
    pricing:
      model: "retainer"
      amount: 0                 # TODO: monthly GBP management fee — see Q4 ask
      currency: "USD"
      billing_frequency: "monthly"
    typical_timeline_days: 30
    ideal_for: "Local service businesses where customers search 'near me' / 'in [city]' — often bundled with SEO or full-service retainer"

  # Add more services as needed — the automation handles any number

