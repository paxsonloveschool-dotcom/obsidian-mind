# ============================================================================
# ICP — Ideal Client Profile
# ============================================================================
# The qualification agent scores every lead against this. Leads below the
# threshold are auto-disqualified with a gentle "not the right fit" message.
# ============================================================================

icp:
  # Inferred from services (websites + full-service retainer heavy on GBP + local SEO).
  # Confirm or revise when convenient — see open-questions Q3.
  company_type: "Local service businesses — owner-operated, customers come from 'near me' searches"
  company_size_employees:
    min: 2                      # Very small shops still qualify
    max: 150                    # Beyond this, they usually have in-house marketing
  company_revenue_annual:
    min: 500000                 # TODO: confirm — below $500k annual, retainer math usually doesn't work
    max: 15000000               # TODO: confirm — above this, usually has or wants in-house team
  industries_good_fit:
    # Classic GBP-driven verticals where local-pack ranking = revenue
    - "Home services (HVAC, plumbing, electrical, roofing, flooring, windows)"
    - "Landscaping and outdoor services"
    - "Cleaning and janitorial"
    - "Auto repair and detail"
    - "Medical, dental, chiropractic, physical therapy"
    - "Legal (personal injury, family law, estate)"
    - "Restaurants and food service"
    - "Fitness studios and gyms"
    - "Salons, spas, and barbershops"
    - "Pet services (grooming, boarding, training)"
    - "Real estate brokerages and teams"
    - "Retail with local footprint"
  industries_avoid:
    # TODO: confirm — these are reasonable defaults for a local-SEO agency
    - "Pure e-commerce with no local component"
    - "National-only SaaS / B2B tech"
    - "Multi-level marketing / MLM"
    - "Adult / gambling / firearms (brand risk)"
    - "Crypto / NFT projects"
  geographic_focus:
    - "TODO: which regions do you actually serve? (local to your base, state-wide, national?)"
  budget_minimum_monthly: 0     # TODO: smallest monthly retainer you'll take — see Q4 ask
  decision_maker_roles:
    - "Owner"
    - "Founder"
    - "CEO"
    - "President"
    - "VP Marketing"
    - "Director of Marketing"
    - "Marketing Manager (only if reporting to owner directly)"
  disqualifiers:
    - "No marketing budget / looking for 'free work to prove yourself'"
    - "Equity-only compensation"
    - "Performance-only compensation with no base retainer"
    - "Competing directly with an existing client"
    - "Needs service we don't offer (app dev, TV ads, radio, print)"
    - "Requires industries on the avoid list"
    - "Requests unethical work (fake reviews, link schemes, black-hat SEO)"

  scoring:
    # The qualifier assigns points based on fit. Tune these weights.
    weights:
      industry_match: 30
      budget_fit: 30
      company_size_fit: 20
      decision_maker_reached: 15
      geographic_fit: 5
    thresholds:
      auto_qualify: 70          # Score >= this → auto-route to discovery call
      gray_zone: 50             # 50-69 → escalate to owner for judgment call
      auto_disqualify: 49       # < 50 → polite decline, archived with reason

