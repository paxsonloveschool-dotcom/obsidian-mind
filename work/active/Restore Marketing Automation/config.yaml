# ============================================================================
# ICP — Ideal Client Profile
# ============================================================================
# The qualification agent scores every lead against this. Leads below the
# threshold are auto-disqualified with a gentle "not the right fit" message.
# ============================================================================

icp:
  # Define your ideal client. Used by `icp-builder` and `lead-qualification` skills.
  company_type: "TODO: e.g. local service businesses, B2B SaaS, DTC e-commerce, professional services"
  company_size_employees:
    min: 0                      # TODO
    max: 0                      # TODO
  company_revenue_annual:
    min: 0                      # TODO: USD
    max: 0                      # TODO: USD
  industries_good_fit:
    - "TODO: list industries where you win"
  industries_avoid:
    - "TODO: industries you don't serve (or do badly)"
  geographic_focus:
    - "TODO: regions you serve"
  budget_minimum_monthly: 0     # TODO: smallest monthly spend you'll take
  decision_maker_roles:
    - "TODO: CEO, Founder, VP Marketing, etc."
  disqualifiers:
    - "TODO: automatic reasons to pass (e.g. 'requires equity compensation', 'competing with existing client', 'no marketing budget')"

  scoring:
    # The qualifier assigns points based on fit. Tune these weights.
    weights:
      industry_match: 30
      budget_fit: 30
      company_size_fit: 20
      decision_maker_reached: 15
      geographic_fit: 5
    thresholds:
      auto_qualify: 70          # Score >= this → auto-route to discovery call
      gray_zone: 50             # 50-69 → escalate to owner for judgment call
      auto_disqualify: 49       # < 50 → polite decline, archived with reason

